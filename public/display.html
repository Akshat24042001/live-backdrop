<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Backdrop</title>
<!-- Fonts are served from this computer (node_modules/@fontsource), so venue internet cannot break them. -->
<link rel="stylesheet" href="/fonts/poppins/600.css"><link rel="stylesheet" href="/fonts/poppins/700.css"><link rel="stylesheet" href="/fonts/poppins/800.css">
<link rel="stylesheet" href="/fonts/noto-sans-devanagari/600.css"><link rel="stylesheet" href="/fonts/noto-sans-devanagari/700.css">
<link rel="stylesheet" href="/fonts/noto-sans-gujarati/600.css"><link rel="stylesheet" href="/fonts/noto-sans-gujarati/700.css">
<link rel="stylesheet" href="/fonts/cinzel/700.css"><link rel="stylesheet" href="/fonts/great-vibes/400.css">
<link rel="stylesheet" href="/fonts/playfair-display/700.css"><link rel="stylesheet" href="/fonts/playfair-display/800.css"><link rel="stylesheet" href="/fonts/playfair-display/400-italic.css">
<link rel="stylesheet" href="/fonts/inter/600.css"><link rel="stylesheet" href="/fonts/inter/800.css"><link rel="stylesheet" href="/fonts/mukta/700.css">
<style>
  :root {
    --bg1:#070b1a; --bg2:#0d1b3d; --blob1:#1f4bff; --blob2:#ff8a00; --blob3:#00d4b4;
    --ink:#f5f7ff; --muted:rgba(255,255,255,.6); --accent:#ffb020; --accent2:#2ee6c5;
    --card-bg:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 10px 40px rgba(0,0,0,.35); --text-shadow:0 3px 30px rgba(0,0,0,.5);
    --bar:linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 50%, #ff3d71));
    --scale:1; --m:4vh; --reserve:30vh; --font:'Poppins';
    --scripts:'Noto Sans Devanagari','Noto Sans Gujarati','Nirmala UI','Mangal','Shruti',system-ui,sans-serif;
  }
  /* ---------- dark themes ---------- */
  body[data-theme=aurora]  { --bg1:#03121a; --bg2:#0c2a3a; --blob1:#00c2a8; --blob2:#8b5cf6; --blob3:#22d3ee; --accent:#7cf7d4; --accent2:#c4a1ff; }
  body[data-theme=saffron] { --bg1:#1a0705; --bg2:#3a120a; --blob1:#ff6a00; --blob2:#ffb000; --blob3:#c2185b; --accent:#ffb347; --accent2:#ffe08a; }
  body[data-theme=royal]   { --bg1:#050a1f; --bg2:#0e1a4a; --blob1:#2742c9; --blob2:#d4af37; --blob3:#5b21b6; --accent:#e9c46a; --accent2:#9db4ff; }
  body[data-theme=chroma]  { --bg1:#00b140; --bg2:#00b140; --card-bg:#0b1020; --card-border:#0b1020; }
  body[data-theme=transparent] { --bg1:transparent; --bg2:transparent; --card-bg:rgba(8,12,28,.9); --card-border:rgba(255,255,255,.1); }
  body[data-theme=chroma] .bg > *, body[data-theme=transparent] .bg > * { display:none; }
  html:has(body[data-theme=transparent]) { background: transparent; }

  /* ---------- light themes ---------- */
  body[data-theme=ivory] { --bg1:#efe9dc; --bg2:#fbf8f1; --blob1:#f5b971; --blob2:#9ad1c5; --blob3:#f0a6a6; --ink:#17172b; --muted:rgba(23,23,43,.6); --accent:#c2410c; --accent2:#0f766e;
    --card-bg:linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.78)); --card-border:rgba(0,0,0,.08); --card-shadow:0 14px 44px rgba(60,40,10,.14); --text-shadow:none; }

  /* Navyoday: the poster's warm cream sky, navy calligraphy, golden sun and the colourful geometric border. */
  body[data-theme=navyoday] {
    --bg1:#f4ead9; --bg2:#fbf7ef; --ink:#1b3263; --muted:#5a6a8c; --accent:#c87500; --accent2:#c87500;
    --card-bg:linear-gradient(160deg, rgba(255,255,255,.96), rgba(255,253,248,.86)); --card-border:rgba(27,50,99,.10);
    --card-shadow:0 18px 50px rgba(27,50,99,.13), 0 2px 6px rgba(27,50,99,.06); --text-shadow:none;
    --bar:linear-gradient(#1b3263, #2f5aa8 55%, #f2b632);
  }
  /* Behind the Success, lightened: ivory and champagne stage, warm spotlights, espresso text, antique gold. */
  body[data-theme=success] {
    --bg1:#ecdcc0; --bg2:#fffaf1; --ink:#2a1b0f; --muted:#7a5f43; --accent:#a8711a; --accent2:#a8711a;
    --card-bg:linear-gradient(160deg, rgba(255,253,247,.97), rgba(253,247,236,.88)); --card-border:rgba(168,113,26,.32);
    --card-shadow:0 18px 50px rgba(90,60,20,.16), 0 2px 6px rgba(90,60,20,.08); --text-shadow:none;
    --bar:linear-gradient(#e8c66a, #b07d22 60%, #7b5214);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg1); }
  body { cursor: none; font-family: var(--font), var(--scripts); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body[data-font=poppins] { --font:'Poppins'; } body[data-font=inter] { --font:'Inter'; } body[data-font=playfair] { --font:'Playfair Display'; }
  body[data-font=mukta] { --font:'Mukta'; } body[data-font=system] { --font:'Segoe UI'; }

  /* ---------- background layers ---------- */
  .bg { position: fixed; inset: 0; background: radial-gradient(120% 120% at 50% 0%, var(--bg2), var(--bg1) 65%); transition: background .8s; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35; will-change: transform; }
  .b1 { width: 55vw; height: 55vw; left: -10vw; top: -15vw; background: var(--blob1); animation: d1 28s ease-in-out infinite alternate; }
  .b2 { width: 45vw; height: 45vw; right: -8vw; bottom: -12vw; background: var(--blob2); opacity: .22; animation: d2 34s ease-in-out infinite alternate; }
  .b3 { width: 35vw; height: 35vw; left: 35vw; top: 30vh; background: var(--blob3); opacity: .16; animation: d3 40s ease-in-out infinite alternate; }
  body.still .blob, body.still .beam, body.still .sun { animation: none !important; }
  @keyframes d1 { to { transform: translate(18vw, 14vh) scale(1.15); } }
  @keyframes d2 { to { transform: translate(-20vw, -12vh) scale(1.1); } }
  @keyframes d3 { to { transform: translate(-14vw, 16vh) scale(1.25); } }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(127,127,127,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(127,127,127,.06) 1px, transparent 1px); background-size: 6vw 6vw; mask-image: radial-gradient(70% 70% at 50% 50%, #000 30%, transparent 100%); }
  .deco { display: none; position: absolute; }

  body[data-theme=navyoday] .blob, body[data-theme=navyoday] .grid, body[data-theme=success] .blob, body[data-theme=success] .grid { display: none; }
  body[data-theme=navyoday] .bg { background:
      radial-gradient(70% 55% at 50% 4%, rgba(255,204,102,.42), rgba(255,204,102,0) 62%),
      radial-gradient(60% 40% at 12% 100%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
      radial-gradient(60% 40% at 88% 100%, rgba(255,240,222,.85), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #fdf9f2 0%, #f8f0e3 55%, #f1e1cb 100%); }
  body[data-theme=navyoday] .strip { display: block; left: 0; right: 0; height: 5.4vh; background-repeat: repeat-x; background-size: auto 100%; }
  body[data-theme=navyoday] .strip.top { top: 0; }
  body[data-theme=navyoday] .strip.bottom { bottom: 0; transform: scaleY(-1); }
  body[data-theme=navyoday] .lines { display: block; inset: 0; }
  .lines i { position: absolute; width: 22vh; height: 2px; border-radius: 2px; opacity: .55; }
  body[data-theme=navyoday] .sun { display: block; left: 50%; top: -30vh; width: 90vh; height: 90vh; margin-left: -45vh; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(242,182,50,.10) 0 4deg, rgba(242,182,50,0) 4deg 12deg);
      mask-image: radial-gradient(circle, #000 18%, transparent 62%); animation: spin 240s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  body[data-theme=success] .bg { background:
      radial-gradient(90% 55% at 50% 0%, #fffdf8 0%, rgba(255,250,240,0) 70%),
      radial-gradient(70% 30% at 50% 104%, rgba(214,163,72,.38), rgba(214,163,72,0) 70%),
      linear-gradient(180deg, #fbf4e8 0%, #f4e7d1 60%, #ead6b5 100%); }
  body[data-theme=success] .beam { display: block; top: -10vh; width: 26vw; height: 120vh; transform-origin: 50% 0;
      background: linear-gradient(180deg, rgba(232,190,100,.34), rgba(232,190,100,0) 78%); filter: blur(18px); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
  body[data-theme=success] .beam.l { left: 4vw; transform: rotate(16deg); animation: sway 16s ease-in-out infinite alternate; }
  body[data-theme=success] .beam.r { right: 4vw; transform: rotate(-16deg); animation: sway2 18s ease-in-out infinite alternate; }
  body[data-theme=success] .beam.c { left: 37vw; opacity: .7; }
  @keyframes sway { to { transform: rotate(10deg); } }
  @keyframes sway2 { to { transform: rotate(-10deg); } }
  body[data-theme=success] .pillar { display: block; top: 0; bottom: 0; width: 1.1vw; background: linear-gradient(180deg, rgba(200,150,60,0), rgba(200,150,60,.45) 30%, rgba(200,150,60,.45) 70%, rgba(200,150,60,0)); }
  body[data-theme=success] .pillar.l { left: 2.2vw; } body[data-theme=success] .pillar.r { right: 2.2vw; }

  /* ---------- brand header ---------- */
  .brand { position: fixed; left: var(--m); right: var(--m); top: calc(var(--m) * .6); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 2vw; transition: opacity .6s; z-index: 2; }
  .brand .side { display: flex; align-items: center; min-height: 1px; }
  .brand .side.r { justify-content: flex-end; }
  .brand img { display: none; }
  .brand img.on { display: block; }
  .brand .side img { height: 10.5vh; width: auto; }
  .brand .side.r img { height: 5.6vh; margin-top: 2.6vh; }
  .brand .mid { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .brand .mid img { height: 15vh; width: auto; }
  .title { font-size: clamp(14px, 1.5vw, 34px); letter-spacing: .28em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
  .tagline { display: none; }
  body.no-title .brand { opacity: 0; }
  /* classic header for the dark themes: dot + title at the top left */
  body:not([data-theme=navyoday]):not([data-theme=success]) .brand { grid-template-columns: auto 1fr auto; }
  body:not([data-theme=navyoday]):not([data-theme=success]) .brand .mid { text-align: left; align-items: flex-start; grid-column: 2; }
  body:not([data-theme=navyoday]):not([data-theme=success]) .brand .mid img { height: 7vh; }
  body:not([data-theme=navyoday]):not([data-theme=success]) .title::before { content: ''; display: inline-block; width: .9em; height: .9em; margin-right: .8em; border-radius: 50%; background: var(--accent); vertical-align: -.1em; box-shadow: 0 0 24px var(--accent); }

  body[data-theme=navyoday] .brand { top: calc(5.4vh + 1.6vh); }
  body[data-theme=navyoday] .title { font-family: 'Cinzel', serif; font-weight: 700; color: var(--ink); letter-spacing: .14em; font-size: clamp(12px, 1.25vw, 30px); margin-top: .6vh; }
  body[data-theme=navyoday] .tagline { display: block; font-family: 'Great Vibes', cursive; color: var(--ink); font-size: clamp(16px, 2vw, 46px); margin-top: .2vh; }

  body[data-theme=success] .brand { top: 3vh; }
  body[data-theme=success] .title { font-family: 'Playfair Display', serif; font-weight: 800; letter-spacing: .04em; font-size: clamp(30px, 4.4vw, 110px); line-height: 1;
      background: linear-gradient(180deg, #3a2612 0%, #3a2612 46%, #9a6a1e 52%, #d8a948 72%, #8a5c16 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body[data-theme=success] .tagline { display: block; font-family: 'Playfair Display', serif; font-style: italic; color: var(--muted); font-size: clamp(14px, 1.6vw, 40px); margin-top: .8vh; }
  body[data-theme=success] .tagline::before, body[data-theme=success] .tagline::after { content: '◆'; color: #b8862b; font-style: normal; font-size: .55em; vertical-align: .25em; margin: 0 1em; }

  /* ---------- speaker photo panel: photo on one side, name and role under it, highlights take the rest ---------- */
  :root { --pw: 30vw; }
  .portrait { position: fixed; top: var(--stage-top, 22vh); bottom: calc(var(--m) + var(--strip, 0px)); width: var(--pw); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.8vh; z-index: 1; transition: opacity .5s; }
  body[data-theme=navyoday] { --strip: 5.4vh; }
  body.has-photo .portrait { display: flex; }
  body.photo-left .portrait { left: var(--m); } body.photo-right .portrait { right: var(--m); }
  .portrait .frame { position: relative; height: calc(100% - 13vh); max-height: 62vh; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 2.2vh; overflow: hidden; background: #ddd;
                     box-shadow: 0 0 0 .55vh var(--accent), 0 2.4vh 6vh rgba(0,0,0,.28); }
  body[data-theme=navyoday] .portrait .frame { box-shadow: 0 0 0 .5vh #fff, 0 0 0 1vh #f2b632, 0 2.4vh 6vh rgba(27,50,99,.25); }
  body[data-theme=success] .portrait .frame { box-shadow: 0 0 0 .45vh #fffaf1, 0 0 0 .95vh #c99234, 0 2.4vh 6vh rgba(90,60,20,.28); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; transition: opacity .45s; }
  .portrait.swap img, .portrait.swap .pn, .portrait.swap .pr { opacity: 0; }
  .portrait .pn { font-weight: 800; font-size: clamp(18px, 2.3vw, 60px); line-height: 1.1; text-align: center; transition: opacity .45s; max-width: 100%; }
  .portrait .pr { font-weight: 600; font-size: clamp(12px, 1.25vw, 32px); color: var(--muted); text-align: center; transition: opacity .45s; max-width: 100%; }
  body[data-theme=success] .portrait .pn { font-family: 'Playfair Display', serif; background: linear-gradient(180deg, #3a2612 0%, #3a2612 46%, #9a6a1e 60%, #8a5c16 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body.has-photo .speaker { display: none; }
  /* highlights move over to the other side */
  body.has-photo.photo-left .stage { left: calc(var(--m) + var(--pw) + 2.5vw); right: calc(var(--m) + 1vw); }
  body.has-photo.photo-right .stage { right: calc(var(--m) + var(--pw) + 2.5vw); left: calc(var(--m) + 1vw); }
  body.has-photo .layout-upper { bottom: calc(var(--m) + var(--strip, 0px) + 2vh); }
  body.has-photo .layout-scatter .card { max-width: 40vw; }
  body.standby-on .portrait { opacity: 0; }

  /* ---------- speaker lower third ---------- */
  .speaker { position: fixed; left: var(--m); bottom: calc(var(--m) + 1vh); padding-left: 1.2vw; border-left: .4vw solid var(--accent2); opacity: 0; transition: opacity .8s, bottom .6s; z-index: 2; }
  body[data-theme=navyoday] .speaker { bottom: calc(5.4vh + var(--m)); }
  .speaker .n { font-size: clamp(18px, 2.2vw, 52px); font-weight: 800; }
  .speaker .r { font-size: clamp(12px, 1.2vw, 28px); color: var(--muted); font-weight: 700; margin-top: .2em; }
  .speaker.on { opacity: .95; }
  body.cap-on .speaker { bottom: calc(var(--m) + 13vh); }

  /* ---------- highlight cards ---------- */
  .stage { position: fixed; inset: 0; z-index: 1; }
  .card { font-weight: 700; line-height: 1.14; font-size: calc(clamp(30px, 4.4vw, 130px) * var(--scale)); letter-spacing: -.01em; padding: .34em .7em .4em .82em; border-radius: .42em;
          background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(6px); box-shadow: var(--card-shadow); text-shadow: var(--text-shadow);
          position: relative; transition: opacity .55s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1), filter .55s, font-size .45s; will-change: transform, opacity; overflow-wrap: break-word; }
  .card::before { content: ''; position: absolute; left: 0; top: .3em; bottom: .3em; width: .12em; border-radius: 1em; background: var(--bar); }
  .card.alt::before { background: linear-gradient(var(--accent2), color-mix(in srgb, var(--accent2) 50%, #3b82ff)); }
  body[data-theme=navyoday] .card.alt::before, body[data-theme=success] .card.alt::before, body[data-theme=ivory] .card.alt::before { background: var(--bar); }
  .card .kw { color: var(--accent); }
  .card.alt .kw { color: var(--accent2); }
  body[data-theme=success] .card .kw { background: linear-gradient(180deg, #c99234, #8a5a12); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .txt { display: inline; transition: opacity .18s, filter .18s; }
  .card.morph .txt { opacity: 0; filter: blur(6px); }
  .card.glow { animation: glow 1.1s ease-out; }
  @keyframes glow { 0% { box-shadow: var(--card-shadow), 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: var(--card-shadow), 0 0 0 1.2em color-mix(in srgb, var(--accent) 0%, transparent); } }
  /* kinds: stat (number big), keyword (spaced capitals), quote (soft quote marks), takeaway (plain) */
  .card.k-stat .num, .card.k-announcement .num { display: block; font-size: 1.22em; font-weight: 800; letter-spacing: -.02em; line-height: 1.02; color: var(--accent); }
  body[data-theme=success] .card.k-stat .num, body[data-theme=success] .card.k-announcement .num { background: linear-gradient(180deg, #c99234, #8a5a12); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card.k-stat .lbl, .card.k-announcement .lbl { display: block; font-size: .5em; font-weight: 600; margin-top: .25em; letter-spacing: .01em; }
  .card.k-stat .lbl:empty, .card.k-announcement .lbl:empty { display: none; }
  /* list: the parts the speaker named as one set, side by side with a dot between */
  .card.k-list .part { display: inline-block; white-space: nowrap; }
  .card.k-list .dot { display: inline-block; color: var(--accent); padding: 0 .3em; font-weight: 800; }
  .card.k-keyword { text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
  .card.k-keyword .txt { color: var(--accent); }
  body[data-theme=success] .card.k-keyword .txt { background: linear-gradient(180deg, #c99234, #8a5a12); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .q { color: var(--accent); opacity: .7; font-family: 'Playfair Display', serif; padding: 0 .06em; }
  .card .more { display: none; color: var(--accent); }
  /* labels above, credits below, and the new kinds */
  .card .txt { display: block; }
  .card .eyebrow { display: block; font-size: .3em; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: var(--accent); margin-bottom: .45em; }
  .card.k-milestone .eyebrow { font-size: .42em; letter-spacing: .08em; }
  .card .attr { display: block; font-size: .36em; font-weight: 600; font-style: italic; color: var(--muted); margin-top: .5em; letter-spacing: .02em; }
  .card.k-contrast .ca { display: block; font-size: .72em; font-weight: 600; opacity: .62; }
  .card.k-contrast .cb { display: block; color: var(--accent); margin-top: .12em; }
  body[data-theme=success] .card.k-contrast .cb { color: #8a5a12; }
  .card.k-question .txt { font-style: italic; }
  .card.k-wisdom .txt { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; }
  .card .smile { color: var(--accent); }
  .card.open .more { display: inline; animation: dots 1.4s ease-in-out infinite; }
  @keyframes dots { 50% { opacity: .25; } }
  .card .w { display: inline-block; opacity: 0; transform: translateY(.3em); transition: opacity .3s, transform .3s; }
  .card.in .w { opacity: 1; transform: none; }
  .card.pinned::after { content: ''; position: absolute; right: .35em; top: .35em; width: .16em; height: .16em; border-radius: 50%; background: var(--accent); }

  /* entrance styles */
  .card { opacity: 0; }
  .anim-rise .card { transform: translateY(32px) scale(.96); }
  .anim-zoom .card { transform: scale(.75); }
  .anim-blur .card { filter: blur(16px); transform: scale(1.04); }
  .anim-none .card { transition: none; }
  .card.in { opacity: 1; transform: none; filter: none; }
  .card.out { opacity: 0 !important; transform: translateY(-24px) scale(.97) !important; transition-duration: .9s; }

  /* layout: upper — the newest line big and centred above the speaker, older ones smaller below it; the bottom stays clear */
  .layout-upper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; text-align: center;
                  top: var(--stage-top, 22vh); bottom: var(--reserve); left: calc(var(--m) + 4vw); right: calc(var(--m) + 4vw); inset: var(--stage-top, 22vh) calc(var(--m) + 4vw) var(--reserve); }
  .layout-upper .card { max-width: 100%; padding: .3em .8em .36em; }
  .layout-upper .card::before { left: 50%; top: auto; bottom: -.1em; width: 2.4em; height: .1em; transform: translateX(-50%); }
  .layout-upper .card:last-child { order: -1; }
  .layout-upper .card:not(:last-child) { font-size: calc(clamp(18px, 2.3vw, 64px) * var(--scale)); }
  .layout-upper .card.in:not(:last-child) { opacity: .62; }
  /* layout: scatter */
  .layout-scatter .card { position: absolute; max-width: 44vw; }
  /* layout: stack */
  .layout-stack { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2.4vh; padding: 14vh calc(var(--m) + 4vw) 18vh; }
  .layout-stack .card { max-width: 72vw; }
  .layout-stack .card.in:not(:last-child) { opacity: .55; font-size: calc(clamp(22px, 3vw, 80px) * var(--scale)); }
  /* layout: hero */
  .layout-hero { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2.4vh; padding: 12vh 8vw 18vh; text-align: center; }
  .layout-hero .card { max-width: 84vw; padding: .35em .9em .4em; }
  .layout-hero .card::before { left: 50%; top: auto; bottom: -.12em; width: 2.2em; height: .12em; transform: translateX(-50%); }
  .layout-hero .card:last-child { font-size: calc(clamp(40px, 7.2vw, 200px) * var(--scale)); order: -1; }
  .layout-hero .card:not(:last-child) { font-size: calc(clamp(18px, 2.3vw, 60px) * var(--scale)); }
  .layout-hero .card.in:not(:last-child) { opacity: .55; }

  /* live captions */
  .captions { position: fixed; left: 50%; bottom: var(--m); transform: translateX(-50%); width: min(80vw, 1800px); max-height: 11vh; overflow: hidden; display: none; z-index: 2;
              font-size: clamp(16px, 1.9vw, 46px); line-height: 1.3; font-weight: 600; color: var(--muted); text-align: center; mask-image: linear-gradient(transparent, #000 35%); }
  body[data-theme=navyoday] .captions { bottom: calc(5.4vh + var(--m)); }
  body.cap-on .captions { display: flex; flex-direction: column; justify-content: flex-end; }
  .captions .hl { color: var(--ink); background: color-mix(in srgb, var(--accent) 25%, transparent); border-radius: .2em; padding: 0 .15em; }

  /* standby */
  .standby { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center; opacity: 0; pointer-events: none; transition: opacity 1s; z-index: 3; padding: 0 8vw; }
  .standby .t1 { font-size: clamp(30px, 5vw, 160px); font-weight: 800; line-height: 1.1; }
  .standby .t2 { font-size: clamp(14px, 1.6vw, 40px); letter-spacing: .3em; text-transform: uppercase; color: var(--accent); font-weight: 800; }
  .standby img { max-height: 30vh; max-width: 60vw; display: none; } .standby img.on { display: block; }
  body[data-theme=navyoday] .standby .t1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(34px, 5.4vw, 170px); }
  body[data-theme=navyoday] .standby .t2 { font-family: 'Cinzel', serif; color: var(--ink); letter-spacing: .16em; }
  body[data-theme=success] .standby .t1 { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400; font-size: clamp(26px, 3.6vw, 110px); color: var(--muted); }
  body[data-theme=success] .standby .t2 { font-family: 'Playfair Display', serif; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(36px, 6vw, 170px);
      background: linear-gradient(180deg, #3a2612 0%, #3a2612 46%, #9a6a1e 52%, #d8a948 72%, #8a5c16 100%); -webkit-background-clip: text; background-clip: text; color: transparent; order: -1; }
  body.standby-on .standby { opacity: 1; }
  body.standby-on .stage, body.standby-on .speaker, body.standby-on .captions, body.standby-on .brand { opacity: 0; transition: opacity .8s; }

  .identify { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); font: 800 6vw/1 system-ui; color: #fff; z-index: 50; outline: 1.2vw solid #ffb020; outline-offset: -1.2vw; }
  .identify.on { display: flex; }
  .dot { position: fixed; right: 10px; bottom: 10px; width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; display: none; z-index: 40; }
  body.debug .dot { display: block; } .dot.ok { background: #35e08a; }

  /* ---------- hidden operator drawer (only visible while open) ---------- */
  .hot { position: fixed; left: 0; top: 0; width: 70px; height: 70px; z-index: 60; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 94vw); z-index: 70; background: #0b0e1a; color: #e8ebf7; box-shadow: -20px 0 60px rgba(0,0,0,.6);
            transform: translateX(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; cursor: auto; font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; visibility: hidden; }
  .drawer.open { transform: none; visibility: visible; }
  .drawer header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #12162a; border-bottom: 1px solid #22284a; }
  .drawer header b { flex: 1; font-size: 13px; letter-spacing: .04em; }
  .drawer header small { display: block; color: #ffcf6a; font-weight: 500; font-size: 11px; }
  .drawer header button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; background: #2a3158; color: #fff; cursor: pointer; }
  .drawer iframe { flex: 1; border: 0; width: 100%; background: #0b0e1a; }
  .gate { padding: 28px 20px; display: none; }
  .gate.on { display: block; }
  .gate input { width: 100%; font: inherit; padding: 12px; border-radius: 8px; border: 1px solid #2a3158; background: #151a30; color: #fff; margin: 10px 0; }
  .gate button { font: inherit; border: 0; border-radius: 8px; padding: 12px 16px; background: #3b5bff; color: #fff; cursor: pointer; }
  .gate .err { color: #ff8a9a; min-height: 1.4em; }
  body.drawer-open { cursor: auto; }
</style>
</head>
<body data-theme="navyoday" data-font="poppins" class="anim-rise">
<div class="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>
  <div class="deco sun"></div>
  <div class="deco strip top" id="stripTop"></div><div class="deco strip bottom" id="stripBottom"></div>
  <div class="deco lines" id="lines"></div>
  <div class="deco beam l"></div><div class="deco beam c"></div><div class="deco beam r"></div>
  <div class="deco pillar l"></div><div class="deco pillar r"></div>
</div>
<div class="brand" id="brand">
  <div class="side l"><img id="logoLeft" alt=""></div>
  <div class="mid"><img id="logo" alt=""><div class="title" id="title"></div><div class="tagline" id="tagline"></div></div>
  <div class="side r"><img id="logoRight" alt=""></div>
</div>
<div class="stage layout-upper" id="stage"></div>
<div class="speaker" id="speaker"><div class="n" id="spName"></div><div class="r" id="spRole"></div></div>
<div class="portrait" id="portrait"><div class="frame"><img id="spPhoto" alt=""></div><div class="pn" id="pName"></div><div class="pr" id="pRole"></div></div>
<div class="captions" id="captions"><div id="capText"></div></div>
<div class="standby"><img id="sbLogo" alt=""><div class="t1" id="sbText"></div><div class="t2" id="sbTitle"></div></div>
<div class="identify" id="identify">THIS IS THE BACKDROP</div>
<div class="dot" id="dot"></div>

<div class="hot" id="hot" title=""></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <b>Backdrop settings<small>Visible on this screen while open. Close before the audience looks.</small></b>
    <button id="btnFs" title="Fullscreen (F)">⛶</button>
    <button id="btnClose" title="Close (Esc)">Close ✕</button>
  </header>
  <div class="gate" id="gate">
    <b>Operator key</b>
    <div style="color:#8d95b8;margin-top:4px">The CONTROL_KEY from your .env file (default: jito). Remembered on this computer.</div>
    <input type="password" id="gateKey" placeholder="Operator key" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button id="gateGo">Unlock settings</button>
  </div>
  <iframe id="panel" title="Operator panel" allow="microphone; speaker-selection; window-management; fullscreen; display-capture" hidden></iframe>
</aside>

<script>
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const params = new URLSearchParams(location.search);
const PREVIEW = params.has('preview'); // thumbnail inside the operator panel
if (params.has('debug')) document.body.classList.add('debug');
if (params.get('key')) { try { localStorage.setItem('ctlKey', params.get('key')); } catch {} history.replaceState(null, '', location.pathname); }

let look = {};
const items = new Map(); // id -> { item, el, slot, timer }
const liveKeywords = () => [...items.values()].map((u) => u.item.keyword || u.item.text).filter(Boolean);

/* ---------- Navyoday decorations, drawn from the poster's palette ---------- */
(function decorate() {
  const C = ['#6b5ca5', '#1f3a6d', '#f6c343', '#3fae6a', '#e05a4f', '#a99bd6', '#2c4f8c'];
  const shapes = [
    (c) => `<rect width="60" height="60" fill="${c}"/><circle cx="30" cy="60" r="30" fill="#fdf9f2"/>`,
    (c) => `<circle cx="30" cy="30" r="28" fill="${c}"/>`,
    (c) => `<polygon points="0,60 30,0 60,60" fill="${c}"/>`,
    (c) => `<rect width="60" height="60" fill="${c}"/><polygon points="0,0 60,0 30,40" fill="#fdf9f2"/>`,
    (c) => `<path d="M0 60 A60 60 0 0 1 60 0 L60 60 Z" fill="${c}"/>`,
    (c) => `<rect x="4" y="4" width="52" height="52" rx="6" fill="${c}"/>`,
  ];
  let svg = '', x = 0;
  for (let i = 0; i < 24; i++) { svg += `<g transform="translate(${x} 0)">${shapes[(i * 7 + 3) % shapes.length](C[(i * 5 + 1) % C.length])}</g>`; x += 60; }
  const url = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${x}' height='60' viewBox='0 0 ${x} 60'>${svg}</svg>`)}")`;
  $('stripTop').style.backgroundImage = url; $('stripBottom').style.backgroundImage = url;
  const lines = [['#6b5ca5', 3, 22, 38], ['#e05a4f', 1, 70, -38], ['#3fae6a', 2, 46, 38], ['#f6c343', 1, 58, -38]];
  $('lines').innerHTML = lines.flatMap(([c, l, t, r]) => [
    `<i style="background:${c};left:${l}vw;top:${t}vh;transform:rotate(${r}deg)"></i>`,
    `<i style="background:${c};right:${l}vw;top:${t}vh;transform:rotate(${-r}deg)"></i>`,
  ]).join('');
})();

/* ---------- card placement (scatter layout) ---------- */
function slots() {
  const m = look.safeMargin ?? 4;
  const top = m + 10, left = m + 1, w = 100 - 2 * left;
  return [
    { x: left, y: top }, { x: left + w * .48, y: top + 12 }, { x: left + 3, y: top + 34 }, { x: left + w * .5, y: top + 46 },
    { x: left + w * .24, y: top + 22 }, { x: left + w * .24, y: top + 58 },
  ];
}
function freeSlot() {
  const S = slots(), taken = new Set([...items.values()].map((u) => u.slot));
  const free = S.map((_, i) => i).filter((i) => !taken.has(i));
  if (!free.length) return 0;
  const preferred = free.filter((i) => i < Math.max(4, look.maxVisible || 4));
  const pool = preferred.length ? preferred : free;
  return pool[Math.floor(Math.random() * Math.min(pool.length, 2))];
}

// Small label above an item (when "Small labels" is on): what kind of moment this is.
const EYEBROW = { question: 'Think about it', wisdom: 'Wisdom', announcement: 'Announcement', milestone: '', humor: '', tribute: '' };
const SMILE = '<svg viewBox="0 0 24 24" width="0.8em" height="0.8em" aria-hidden="true" style="vertical-align:-0.08em;margin-right:.25em"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="9.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="9.5" r="1.4" fill="currentColor"/><path d="M7 14.5c1.3 2 3 3 5 3s3.7-1 5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// The words of an item, with the key word coloured and an optional word-by-word entrance.
function wordsInto(parent, text, keyword) {
  const kwWords = new Set((look.emphasizeKeyword && keyword ? keyword : '').split(/\s+/).filter(Boolean));
  const perWord = document.body.classList.contains('anim-type');
  let i = 0;
  for (const w of text.split(/(\s+)/)) {
    if (/^\s+$/.test(w)) { parent.appendChild(document.createTextNode(w)); continue; }
    const span = document.createElement('span');
    span.textContent = w;
    if (kwWords.has(w)) span.classList.add('kw');
    if (perWord) { span.classList.add('w'); span.style.transitionDelay = (i++ * 0.12) + 's'; }
    parent.appendChild(span);
  }
}
const add = (parent, cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; parent.appendChild(s); return s; };

function fillText(el, item) {
  el.textContent = '';
  const kind = item.kind || 'quote';
  el.className = el.className.replace(/\bk-\w+/g, '').trim() + ' k-' + kind;
  const labels = look.showLabels !== false;
  const person = (item.person || '').trim();
  const txt = document.createElement('span');
  txt.className = 'txt';
  let text = item.text;

  // Label above: the kind of moment, or the year of a milestone.
  let eyebrow = EYEBROW[kind] || '';
  if (kind === 'milestone' && item.keyword) { eyebrow = item.keyword; text = text.replace(item.keyword, '').replace(/^[\s,·:–-]+|[\s,·:–-]+$/g, '') || item.text; }
  if (labels && eyebrow) add(el, 'eyebrow', eyebrow);

  if (kind === 'list' && text.includes('·')) {
    // "Quality · consistency · character": the parts side by side, a dot between, never broken mid-part.
    text.split('·').map((p) => p.trim()).filter(Boolean).forEach((p, i) => {
      if (i) add(txt, 'dot', '·');
      wordsInto(add(txt, 'part', ''), p, '');
    });
  } else if ((kind === 'stat' || kind === 'announcement') && item.keyword && text.includes(item.keyword)) {
    // A stat or an announced amount shows its number big, with what it measures underneath.
    add(txt, 'num', item.keyword);
    add(txt, 'lbl', text.replace(item.keyword, ' ').replace(/^[\s,·:–-]+|[\s,·:–-]+$/g, '').replace(/\s{2,}/g, ' '));
  } else if (kind === 'contrast' && text.includes('|')) {
    // "Not X | but Y": the first half quieter, the second half the point.
    const [x, ...rest] = text.split('|');
    wordsInto(add(txt, 'ca', ''), x.trim(), '');
    wordsInto(add(txt, 'cb', ''), rest.join('|').trim(), item.keyword);
  } else {
    if (kind === 'humor') txt.insertAdjacentHTML('beforeend', `<span class="smile">${SMILE}</span>`);
    if (kind === 'quote' || kind === 'tribute' || kind === 'wisdom') add(txt, 'q', '“');
    if (kind === 'question' && !/[?？]\s*$/.test(text)) text += '?'; // a question always reads as one
    wordsInto(txt, text, item.keyword);
    add(txt, 'more', '…');
    if (kind === 'quote' || kind === 'tribute' || kind === 'wisdom') add(txt, 'q', '”');
  }
  el.appendChild(txt);
  // Who it is credited to, underneath: "— Pitaji", "— Gurudev".
  if (labels && person && ['tribute', 'quote', 'wisdom'].includes(kind)) add(el, 'attr', '— ' + person);
  el.classList.toggle('open', item.complete === false); // still being spoken: a soft "…" until the AI completes it
}

// Keep the words of every item to two lines (three for a contrast): shrink the font only when needed.
// Labels above and credits below are not counted.
function fit(el) {
  el.style.fontSize = '';
  const txt = el.querySelector('.txt');
  if (!txt) return;
  const maxLines = el.classList.contains('k-contrast') ? 3.3 : el.classList.contains('k-stat') ? 3.4 : 2.2;
  let size = parseFloat(getComputedStyle(el).fontSize);
  for (let n = 0; n < 14; n++) {
    const lines = txt.getBoundingClientRect().height / (size * 1.14);
    if (lines <= maxLines && el.scrollWidth <= el.clientWidth + 2) break;
    size *= 0.92;
    el.style.fontSize = size + 'px';
  }
}
const refit = () => { for (const u of items.values()) fit(u.el); };
addEventListener('resize', () => { clearTimeout(refit.t); refit.t = setTimeout(refit, 150); });

function placeCard(u) {
  const el = u.el;
  if (look.layout === 'scatter') {
    const s = slots()[u.slot ?? 0];
    el.style.left = s.x + 'vw'; el.style.top = s.y + 'vh';
  } else { el.style.left = ''; el.style.top = ''; }
}

function showCard(item, animate = true) {
  if (items.has(item.id)) return updateCard(item);
  const el = document.createElement('div');
  el.className = 'card' + (item.id % 2 ? '' : ' alt') + (item.ttl === 0 ? ' pinned' : '');
  fillText(el, item);
  const u = { item, el, slot: look.layout === 'scatter' ? freeSlot() : null, timer: null };
  placeCard(u);
  stage.appendChild(el);
  // Older cards shrink when a new one arrives; re-fit them all.
  requestAnimationFrame(refit);
  if (animate) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in'))); else el.classList.add('in');
  armLocalExpiry(u, item.ttl);
  items.set(item.id, u);
  refreshCaptions();
}

// The speaker completed or sharpened an idea: rewrite the same card in place.
function updateCard(item) {
  const u = items.get(item.id);
  if (!u) return showCard(item);
  const sameText = u.item.text === item.text;
  u.item = item;
  armLocalExpiry(u, item.ttl);
  if (sameText) { u.el.classList.toggle('open', item.complete === false); return; }
  u.el.classList.add('morph');
  setTimeout(() => {
    fillText(u.el, item);
    fit(u.el);
    u.el.classList.remove('morph');
    u.el.classList.remove('glow'); void u.el.offsetWidth; u.el.classList.add('glow');
  }, 180);
  refreshCaptions();
}

function armLocalExpiry(u, ttl) {
  clearTimeout(u.timer);
  if (ttl) u.timer = setTimeout(() => hideCard(u.item.id), (ttl + 3) * 1000); // safety net; the server normally hides first
}

function hideCard(id) {
  const u = items.get(id);
  if (!u) return;
  clearTimeout(u.timer);
  items.delete(id);
  u.el.classList.remove('in');
  u.el.classList.add('out');
  setTimeout(() => { u.el.remove(); refit(); }, 950);
  refreshCaptions();
}

function rebuild(liveList) {
  for (const u of items.values()) { clearTimeout(u.timer); u.el.remove(); }
  items.clear();
  for (const it of liveList) showCard(it, false);
}

/* ---------- look ---------- */
function setImg(img, url) { if (url) { if (img.getAttribute('src') !== url) img.src = url; img.classList.add('on'); } else { img.removeAttribute('src'); img.classList.remove('on'); } }

function layoutStage() {
  // The highlight band starts below the header and ends above the reserved bottom (podium, speaker, chairs).
  const brand = $('brand');
  const top = look.showTitle ? brand.getBoundingClientRect().bottom / innerHeight * 100 + 2 : 8;
  document.documentElement.style.setProperty('--stage-top', Math.max(8, Math.min(top, 45)) + 'vh');
}

function applyLook(l, liveList) {
  const prev = look;
  look = l;
  const b = document.body;
  b.dataset.theme = l.theme; b.dataset.font = l.fontFamily;
  b.className = b.className.replace(/\banim-\w+/g, '').trim() + ' anim-' + l.animation;
  b.classList.toggle('no-title', !l.showTitle);
  b.classList.toggle('cap-on', !!l.showCaptions);
  b.classList.toggle('still', !l.animatedBg);
  b.classList.toggle('standby-on', !!l.standby);
  const r = document.documentElement.style;
  r.setProperty('--scale', l.fontScale);
  r.setProperty('--m', (l.safeMargin ?? 4) + 'vh');
  r.setProperty('--reserve', (l.reserveBottom ?? 30) + 'vh');
  // Accents are set on body so they beat the theme selector when set, and fall back to it when cleared.
  if (l.accent) b.style.setProperty('--accent', l.accent); else b.style.removeProperty('--accent');
  if (l.accent2) b.style.setProperty('--accent2', l.accent2); else b.style.removeProperty('--accent2');

  $('title').textContent = l.eventTitle || '';
  $('tagline').textContent = l.eventTagline || '';
  setImg($('logo'), l.logoUrl); setImg($('logoLeft'), l.logoLeft); setImg($('logoRight'), l.logoRight);
  setImg($('sbLogo'), l.logoUrl);
  $('spName').textContent = l.speaker || '';
  $('spRole').textContent = l.speakerRole || '';
  $('speaker').classList.toggle('on', !!(l.showSpeaker && l.speaker));
  applyPortrait(l);
  if (l.theme === 'success') { $('sbText').textContent = l.eventTagline || ''; $('sbTitle').textContent = l.eventTitle || ''; }
  else { $('sbText').textContent = l.standbyText || l.eventTitle || ''; $('sbTitle').textContent = l.logoUrl ? '' : (l.eventTitle || ''); }
  stage.className = 'stage layout-' + l.layout;
  if (!l.showCaptions) $('capText').textContent = '';
  layoutStage();
  setTimeout(layoutStage, 400); // again once logos have loaded

  if (prev.layout !== l.layout || prev.animation !== l.animation || prev.emphasizeKeyword !== l.emphasizeKeyword || prev.safeMargin !== l.safeMargin || prev.theme !== l.theme || prev.fontScale !== l.fontScale || prev.fontFamily !== l.fontFamily || prev.showLabels !== l.showLabels) rebuild(liveList);
  else if (prev.showPhoto !== l.showPhoto || prev.textShare !== l.textShare || prev.photoSide !== l.photoSide || !!prev.speakerPhoto !== !!l.speakerPhoto) setTimeout(refit, 50); // the text column changed width
}
for (const id of ['logo', 'logoLeft', 'logoRight']) $(id).addEventListener('load', layoutStage);
addEventListener('resize', layoutStage);

/* ---------- speaker photo panel ---------- */
let portraitKey = '';
function applyPortrait(l) {
  const on = !!(l.showPhoto && l.speakerPhoto);
  const b = document.body;
  b.classList.toggle('has-photo', on);
  b.classList.toggle('photo-left', l.photoSide !== 'right');
  b.classList.toggle('photo-right', l.photoSide === 'right');
  // The photo takes what the text leaves: textShare 68 -> photo column about 30% of the width.
  document.documentElement.style.setProperty('--pw', ((100 - (l.textShare || 68)) * 0.92).toFixed(1) + 'vw');
  const key = [on, l.speakerPhoto, l.speaker, l.speakerRole].join('|');
  if (key === portraitKey) return;
  const first = !portraitKey;
  portraitKey = key;
  const p = $('portrait');
  const fill = () => {
    $('pName').textContent = l.speaker || '';
    $('pRole').textContent = l.speakerRole || '';
    const img = $('spPhoto');
    if (l.speakerPhoto && img.getAttribute('src') !== l.speakerPhoto) {
      img.onload = () => p.classList.remove('swap');
      img.onerror = () => p.classList.remove('swap');
      img.src = l.speakerPhoto;
    } else p.classList.remove('swap');
    refit();
  };
  if (first || !on) { fill(); return; }
  // A new speaker: fade the old photo and name out, then the new ones in.
  p.classList.add('swap');
  setTimeout(fill, 450);
}

function applyState(s) {
  applyLook(s.look, s.live);
  const ids = new Set(s.live.map((x) => x.id));
  for (const id of [...items.keys()]) if (!ids.has(id)) hideCard(id);
  for (const it of s.live) {
    const u = items.get(it.id);
    if (u) { u.el.classList.toggle('pinned', it.ttl === 0); updateCard(it); }
    else showCard(it);
  }
}

/* ---------- captions with highlighted key words ---------- */
let captionText = '';
function refreshCaptions() {
  const el = $('capText');
  el.textContent = '';
  if (!captionText) return;
  const kws = new Set(liveKeywords().join(' ').toLowerCase().split(/\s+/).filter((w) => w.length > 2));
  for (const part of captionText.split(/(\s+)/)) {
    const clean = part.toLowerCase().replace(/[^\p{L}\p{M}\p{N}]/gu, '');
    if (clean && kws.has(clean)) { const s = document.createElement('span'); s.className = 'hl'; s.textContent = part; el.appendChild(s); }
    else el.appendChild(document.createTextNode(part));
  }
}

/* ---------- connection ---------- */
let ws, backoff = 500;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=display' + (PREVIEW ? '&preview=1' : ''));
  ws.onopen = () => { backoff = 500; $('dot').classList.add('ok'); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') applyState(m);
    else if (m.type === 'show') showCard(m.item);
    else if (m.type === 'update') updateCard(m.item);
    else if (m.type === 'hide') hideCard(m.id);
    else if (m.type === 'caption') { captionText = m.text.trim(); refreshCaptions(); }
    else if (m.type === 'identify') { $('identify').classList.add('on'); setTimeout(() => $('identify').classList.remove('on'), 3000); }
  };
  // If the server restarts, the screen keeps showing the look and fades cards out on their own timers.
  ws.onclose = () => { $('dot').classList.remove('ok'); setTimeout(connect, backoff); backoff = Math.min(backoff * 1.6, 3000); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
connect();

/* ---------- hidden settings drawer ---------- */
const drawer = $('drawer'), frame = $('panel');
let idleTimer;
const getKey = () => { try { return localStorage.getItem('ctlKey') || ''; } catch { return ''; } };
function armIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(closeDrawer, 120000); } // auto-hide after 2 idle minutes
function openDrawer() {
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false'); document.body.classList.add('drawer-open');
  const key = getKey();
  if (!key) { $('gate').classList.add('on'); frame.hidden = true; setTimeout(() => $('gateKey').focus(), 50); }
  else if (!frame.src) loadPanel(key);
  armIdle();
}
function closeDrawer() {
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true'); document.body.classList.remove('drawer-open');
  clearTimeout(idleTimer);
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}
const toggleDrawer = () => (drawer.classList.contains('open') ? closeDrawer() : openDrawer());

function loadPanel(key) {
  $('gate').classList.remove('on');
  frame.hidden = false;
  frame.src = '/control?embed=1&key=' + encodeURIComponent(key);
  frame.onload = () => {
    let ok = false;
    try { ok = frame.contentDocument.title === 'Operator Panel'; } catch {}
    if (!ok) { frame.removeAttribute('src'); frame.hidden = true; try { localStorage.removeItem('ctlKey'); } catch {} $('gate').classList.add('on'); $('gateErr').textContent = 'Wrong key. Try again.'; }
  };
}
$('gateGo').onclick = () => { const k = $('gateKey').value.trim(); if (!k) return; try { localStorage.setItem('ctlKey', k); } catch {} $('gateErr').textContent = ''; loadPanel(k); };
$('gateKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('gateGo').click(); });
$('btnClose').onclick = closeDrawer;
$('hot').addEventListener('dblclick', (e) => { e.stopPropagation(); if (look.showLock) return; toggleDrawer(); });
// Touch screens: three quick taps on the hot corner.
let taps = [];
$('hot').addEventListener('touchend', () => { const t = Date.now(); taps = taps.filter((x) => t - x < 700).concat(t); if (taps.length >= 3) { taps = []; toggleDrawer(); } });
if (PREVIEW) $('hot').remove();
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data === 'drawer:close') closeDrawer();
  else if (e.data === 'drawer:toggle') toggleDrawer();
  else if (e.data === 'drawer:activity') armIdle();
  else if (e.data === 'display:fullscreen') goFs();
});

/* ---------- keyboard, fullscreen, wake lock ---------- */
const goFs = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); };
$('btnFs').onclick = goFs;
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  // Show lock: a stray key on the LED window must never open the drawer or leave fullscreen in front of the audience.
  if (look.showLock) { if (k === 'f' && !document.fullscreenElement) goFs(); return; }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === 's') { e.preventDefault(); toggleDrawer(); return; }
  if (k === 'escape' && drawer.classList.contains('open')) { closeDrawer(); return; }
  if (drawer.classList.contains('open') && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (k === 'f') goFs();
});
// Tell the server every 2 s whether this window is really fullscreen and visible; the panel warns if not.
if (!PREVIEW) setInterval(() => { try { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'display-health', fs: !!document.fullscreenElement, visible: document.visibilityState === 'visible' })); } catch {} }, 2000);
document.addEventListener('click', (e) => { if (PREVIEW) return; if (!drawer.contains(e.target) && !drawer.classList.contains('open') && !document.fullscreenElement && params.get('nofs') === null) document.documentElement.requestFullscreen?.().catch(() => {}); });
let wake; const keepAwake = async () => { try { wake = await navigator.wakeLock.request('screen'); } catch {} };
if (!PREVIEW) keepAwake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.fonts?.ready.then(() => { refit(); layoutStage(); });
</script>
</body>
